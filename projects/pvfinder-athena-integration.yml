shortdescription: PV-Finder integration and validation into Athena
description: >
  PV-Finder is a machine-learning-based primary vertex reconstruction algorithm that we have been developing 
  within the ATLAS Tracking CP group. The algorithm is now relatively mature, with encouraging results on 
  both Run 2/3 data and HL-LHC simulation samples. Our current focus is on integrating PV-Finder into the 
  ATLAS Athena framework, validating its performance, and preparing the work for publication.
  The project would involve:
  - Assisting with the integration and validation of PV-Finder within the Athena framework.
  - Performing timing and performance studies of the Athena implementation and comparing its performance with the current AMVF primary vertex finding algorithm.
  - Contributing to validation studies on Run 2/3 and HL-LHC samples, including the production of performance plots and documentation.
  - Investigating potential optimizations to reduce inference time and computational cost while maintaining physics performance.

